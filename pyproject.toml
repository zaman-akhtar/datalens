[project]
name = "datalens-backend"
version = "0.1.0"
description = "DataLens backend — FastAPI application for CSV analytics with LLM tool-use chat"
requires-python = ">=3.11"
readme = "README.md"

# Runtime dependencies. The `incremental-implementation` skill says to add
# these as each phase needs them; the planning blueprint pins them up front
# so `uv sync` works on a clean machine.
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "google-generativeai>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

# -----------------------------------------------------------------------------
# Tool configuration
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "S", "PT"]
# ANN101/ANN102: don't require type for self/cls.
# S101: allow `assert` in tests.
ignore = ["ANN101", "ANN102", "S101"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101", "ANN"]
